ing is copied, and both copies stay in the server room only."},"choices":[{"key":"off","ar":"النمط تدريجي مع كامل، لكن بقاء النسخة في المبنى نفسه يبقي خطر الحريق.","en":"The pattern is incremental plus full, but keeping the copy in the same building leaves the fire risk."},{"key":"inc","ar":"النسخة التدريجية ليوم الخميس تحتوي وحدها كل النسخ الكاملة الأقدم.","en":"Thursday’s incremental copy by itself contains every older full copy."},{"key":"rare","ar":"النسخ أكثر من مرة في السنة يبطئ العمل، فالشهري الكثير أكثر من اللازم.","en":"Copying more than once a year slows the work, so monthly is already too often."}],"correct":"off","why":{"ar":"التدريجي ينسخ ما تغيّر منذ النسخة السابقة، والكامل أشمل. الوحدة تشير إلى نسخ خارج الموقع وخطة كوارث حتى لا يفنى الأصل والنسخ معاً.","en":"Incremental copies what changed since the last copy, and a full copy is broader. The unit points to off-site copies and a disaster plan so the original and the copies do not die together."},"impact":{"ar":"حريق الغرفة يذهب بالخادم وبالنسخ إن كانت بجانبه.","en":"A fire in the room takes the server and the copies if they sit beside it."},"miss":{"ar":"التدريجي لا يخزّن داخله كل الكامل السابق. وتقليل النسخ إلى مرة سنوية يوسّع ما يُفقد.","en":"An incremental copy does not hold every earlier full copy inside it. Cutting copies to once a year widens what can be lost."}},{"id":"c09","lo":"C","code":{"ar":"ج.ب7 · الحماية","en":"C.P7 · Protection"},"scenario":{"ar":"يريدون منع حركة شبكة غير مسموحة، وفحص الملفات من البرمجيات الضارة.","en":"They want to block network traffic that is not allowed, and to scan files for malware."},"choices":[{"key":"pair","ar":"جدار الحماية يراقب المرور. برنامج مكافحة الفيروسات يفحص الملفات.","en":"A firewall watches traffic. Antivirus software scans files."},{"key":"same","ar":"الاثنان أداة واحدة باسمين.","en":"The two are one tool with two names."},{"key":"swap","ar":"جدار الحماية يحذف الفيروس من داخل المستند، والمكافح يغلق المنافذ.","en":"The firewall removes a virus from inside a document, and antivirus closes the ports."}],"correct":"pair","why":{"ar":"جدار الحماية يقرر مرور الشبكة دخولاً وخروجاً. مكافحة الفيروسات تبحث عن البرمجيات الضارة في الملفات.","en":"A firewall decides whether network traffic may enter or leave. Antivirus looks for malware in files."},"impact":{"ar":"الاكتفاء بأحدهما يترك إما باب الشبكة وإما الملف المصاب.","en":"Relying on only one leaves either the network door or the infected file."},"miss":{"ar":"اختلاف الوظيفة يمنع دمجهما في اسم واحد. وقلب المهمتين يترك كلا الخطرين بلا أداته.","en":"The different jobs stop them being one name. Swapping the jobs leaves both risks without their tool."}},{"id":"c10","lo":"C","code":{"ar":"ج.ب7 · الحماية","en":"C.P7 · Protection"},"scenario":{"ar":"يُشفَّر ملف بمفتاح خاص، ثم يُرسل المفتاح في الرسالة نفسها مع الملف.","en":"A file is encrypted with a private key, then the key is sent in the same message as the file."},"choices":[{"key":"secret","ar":"إرسال المفتاح مع الملف يلغي الحماية. المفتاح يبقى سراً عن غير المخوّلين.","en":"Sending the key with the file removes the protection. The key stays secret from those who are not allowed."},{"key":"with","ar":"المفتاح يسافر مع الملف بأمان لأن الملف مشفّر أصلاً.","en":"The key can travel with the file safely because the file is already encrypted."},{"key":"hash","ar":"تجزئة الملف (hash) هي نفسها فك التشفير، فيُقرأ الأصل من التجزئة.","en":"A hash of the file is the same as decryption, so the original can be read from the hash."}],"correct":"secret","why":{"ar":"تشفير المفتاح الخاص يحتاج المفتاح نفسه للقراءة، فمن معه الملف والمفتاح يقرأ المحتوى. التجزئة توقيع ثابت الطول لا تعيد النص.","en":"Private-key encryption needs that key to read the file, so whoever has both reads the content. A hash is a fixed-length signature; it does not restore the text."},"impact":{"ar":"من يعترض الرسالة يحصل على السر وعلى القفل معاً.","en":"Whoever intercepts the message gets the secret and the lock together."},"miss":{"ar":"التشفير بلا فصل المفتاح لا يخفي شيئاً عن حامل الرسالة. والتجزئة لا تُفك إلى الملف الأصلي.","en":"Encryption without separating the key hides nothing from the person holding the message. A hash does not unlock into the original file."}},{"id":"c11","lo":"C","code":{"ar":"ج.ب7 · الحماية","en":"C.P7 · Protection"},"scenario":{"ar":"تُرسل رسالة بريد بنص عادي بين الخوادم وفيها رقم حساب.","en":"An email is sent as ordinary text between servers, and it contains an account number."},"choices":[{"key":"enc","ar":"النص العادي يُقرأ على الطريق. المحتوى الحساس يُشفَّر، مثلاً بأداة مثل PGP.","en":"Plain text can be read on the path. Sensitive content is encrypted, for example with a tool such as PGP."},{"key":"at","ar":"البريد مشفّر لأن العنوان فيه إشارة @.","en":"Email is encrypted because the address contains an @ sign."},{"key":"web","ar":"قفل موقع الشركة يشفر نصوص كل الرسائل حتى لو لم تُفتح الصفحة.","en":"The lock on the company website encrypts the text of every email even if the page is not opened."}],"correct":"enc","why":{"ar":"الوحدة تقول إن البريد بنص عادي يمكن أن يقرأه خادم على الطريق. تشفير المحتوى غير تشفير صفحة الويب.","en":"The unit says email in plain text can be read by a server on the path. Encrypting the content is not the same as encrypting a web page."},"impact":{"ar":"رقم الحساب يمر على جهات لا تعرفها المؤسسة.","en":"The account number passes through parties the organisation does not know."},"miss":{"ar":"علامة العنوان ليست تشفيراً. وشهادة الموقع تحمي زيارة ذلك الموقع لا رسالة بريد منفصلة.","en":"The sign in an address is not encryption. A website certificate protects a visit to that site, not a separate email."}},{"id":"c12","lo":"C","code":{"ar":"ج · السياسات","en":"C · Policy"},"scenario":{"ar":"متجر إلكتروني يعمل بهدوء طوال الأسبوع، ويخشون يوم تنزيل كبير يتضاعف فيه الطلب.","en":"An online shop is quiet all week, and they fear a sale day when orders multiply."},"choices":[{"key":"scale","ar":"قابلية التوسع: النظام يحتمل الذروة لا متوسط يوم هادئ فقط.","en":"Scalability: the system must cope with the peak, not only a quiet day’s average."},{"key":"quiet","ar":"إذا نجح في الأسبوع الهادئ فسينجح في يوم الذروة بالأجهزة نفسها بلا زيادة.","en":"If it works in a quiet week it will work on the peak day with the same equipment and no increase."},{"key":"small","ar":"قابلية التوسع تعني شراء أصغر خادم حتى تبقى الكلفة منخفضة.","en":"Scalability means buying the smallest server so the cost stays low."}],"correct":"scale","why":{"ar":"قابلية التوسع قدرة البنية على نمو الحركة، كما في ذروة الطلبات. النجاح في يوم هادئ لا يقيس الذروة.","en":"Scalability is the infrastructure’s ability to grow with traffic, as with a peak of orders. Success on a quiet day does not measure the peak."},"impact":{"ar":"يوم العرض قد يفقد مبيعاتاً إذا توقف الموقع عند أول موجة.","en":"The sale day can lose orders if the site stops at the first wave."},"miss":{"ar":"الحمل الهادئ لا يثبت الحمل العالي. وتصغير الخادم يعاكس القدرة على النمو.","en":"A quiet load does not prove a high load. Shrinking the server works against the ability to grow."}},{"id":"c13","lo":"C","code":{"ar":"ج.ب8 · القانون والأخلاق","en":"C.P8 · Law and ethics"},"scenario":{"ar":"موظف ينشر صورة زبون داخل المتجر على حساب المؤسسة بلا إذنه.","en":"An employee posts a photo of a customer inside the shop on the organisation’s account, without permission."},"choices":[{"key":"ask","ar":"النشر يحتاج إذناً. المكان العام لا يلغي خصوصية الشخص.","en":"Publishing needs permission. A public place does not remove the person’s privacy."},{"key":"public","ar":"المتجر مكان عام، فالصورة مباحة بلا سؤال.","en":"The shop is a public place, so the photo is allowed with no question."},{"key":"small","ar":"إذا كان الوجه صغيراً في الإطار فلا تنطبق القاعدة.","en":"If the face is small in the frame, the rule does not apply."}],"correct":"ask","why":{"ar":"الوحدة تعدّ التقاط الصورة أو نشرها بلا إذن غير مناسب أخلاقياً، حتى في مكان يرتاده الناس.","en":"The unit treats taking or publishing a photo without permission as ethically inappropriate, even in a place people visit."},"impact":{"ar":"تخسر المؤسسة ثقة الزبون وقد تعرض نفسها لشكوى خصوصية.","en":"The organisation loses the customer’s trust and may face a privacy complaint."},"miss":{"ar":"عمومية المكان ليست إذناً. وصغر الوجه لا يمحو أن الشخص ظاهر ومُعرَّف بالسياق.","en":"A public place is not permission. A small face does not remove the fact that the person is visible and identified by the context."}},{"id":"c14","lo":"C","code":{"ar":"ج.ب8 · القانون والأخلاق","en":"C.P8 · Law and ethics"},"scenario":{"ar":"تُرمى خراطيش الطابعة وأجهزة قديمة مع نفايات المكتب العادية.","en":"Printer cartridges and old devices are thrown out with ordinary office rubbish."},"choices":[{"key":"ew","ar":"هذه نفايات إلكترونية قد تكون ضارة، والتخلص منها مسألة أخلاقية وغالباً قانونية.","en":"This is electronic waste that may be harmful. Disposal is an ethical matter and often a legal one."},{"key":"none","ar":"الأجهزة الرقمية بلا نفايات مادية بعد انتهاء استخدامها.","en":"Digital devices leave no physical waste after they are finished."},{"key":"paper","ar":"فقط الورق يُحسب نفايات، والأجهزة تُخزَّن في الخزانة بلا سياسة.","en":"Only paper counts as waste. Devices can sit in a cupboard with no policy."}],"correct":"ew","why":{"ar":"الوحدة تذكر التخلص من المعدات والخراطيش أثراً بيئياً، وقد تكون المواد ضارة. التخزين العشوائي ليس معالجة.","en":"The unit names disposal of equipment and cartridges as an environmental effect, and the materials may be harmful. Random storage is not a treatment."},"impact":{"ar":"يضر المحيط ويعرّض المؤسسة للمساءلة إن خالفت قواعد النفايات.","en":"It harms the surroundings and can leave the organisation answerable if waste rules are broken."},"miss":{"ar":"الجهاز والخراطيش مادة تُرمى. وتأجيلها في خزانة لا يعفي من سياسة تخلص سليمة.","en":"The device and the cartridges are material that is thrown away. Leaving them in a cupboard does not remove the need for a sound disposal policy."}},{"id":"c15","lo":"C","code":{"ar":"ج.ب8 · القانون والأخلاق","en":"C.P8 · Law and ethics"},"scenario":{"ar":"موظف يفتح قاعدة خارج صلاحياته ويتصفحها فقط، من دون أن يغيّر شيئاً. المثال القانوني في الوحدة قانون إساءة استخدام الحاسوب لعام 1990.","en":"An employee opens a database outside his permission and only looks, changing nothing. The unit’s legal example is the Computer Misuse Act 1990."},"choices":[{"key":"look","ar":"الدخول غير المأذون جريمة في هذا القانون حتى قبل تعديل البيانات.","en":"Unauthorised access is an offence in this Act even before data is changed."},{"key":"ok","ar":"النظر من دون تعديل مباح دائماً ما دام الملف لم يُمس.","en":"Looking without a change is always allowed as long as the file is untouched."},{"key":"staff","ar":"كونه موظفاً يجعل دخوله مأذوناً ولو منعت السياسة ذلك الجزء.","en":"Being an employee makes his access authorised even if policy forbids that part."}],"correct":"look","why":{"ar":"القانون كما تعرضه الوحدة يجرّم الدخول غير المأذون، ثم يشدد إن قُصدت جريمة أخرى أو عُدّل النظام. الوظيفة لا تمنح كل الصلاحيات.","en":"As the unit presents the Act, unauthorised access is an offence, and it is more serious if a further crime is intended or the system is altered. A job does not grant every permission."},"impact":{"ar":"التصفح وحده يكفي لخرق السياسة وقد يكفي للمسؤولية في هذا المثال القانوني.","en":"Browsing alone can break policy and can be enough for liability in this legal example."},"miss":{"ar":"عدم التعديل لا يمسح الدخول الممنوع. وصفة الموظف لا تلغي حداً وضعته المؤسسة.","en":"The lack of a change does not erase forbidden access. The job title does not cancel a limit the organisation set."}},{"id":"c16","lo":"C","code":{"ar":"ج.ب8 · القانون والأخلاق","en":"C.P8 · Law and ethics"},"scenario":{"ar":"تأخذ المؤسسة صورة ظهرت في نتائج البحث وتضعها في إعلانها.","en":"The organisation takes a picture that appeared in search results and puts it in its advert."},"choices":[{"key":"lic","ar":"يلزم إذن أو رخصة تسمح بإعادة الاستخدام، مثل بعض رخص المشاع الإبداعي.","en":"Permission is required, or a licence that allows reuse, such as some Creative Commons licences."},{"key":"search","ar":"ظهور الصورة في البحث يعني أنها مجانية لإعادة الاستخدام.","en":"The picture appearing in search means it is free to reuse."},{"key":"size","ar":"تغيير القياس يصنع عملاً جديداً ويسقط حق المؤلف.","en":"Changing the size creates a new work and removes copyright."}],"correct":"lic","why":{"ar":"حقوق النشر تشمل الصورة الرقمية. الوحدة تحذّر من استخدام صورة البحث بلا إذن، وتذكر رخص المشاع الإبداعي كطريق مشروع.","en":"Copyright covers a digital image. The unit warns against using a search image without permission, and it mentions Creative Commons as a lawful route."},"impact":{"ar":"الإعلان قد يجر مطالبة حتى لو لم تقصد المؤسسة السرقة.","en":"The advert can lead to a claim even if the organisation did not mean to steal."},"miss":{"ar":"محرك البحث يعرض ولا يهب الملكية. وتصغير الصورة لا ينهي حق صاحبها.","en":"A search engine displays; it does not give ownership. Shrinking the picture does not end the owner’s right."}},{"id":"c17","lo":"C","code":{"ar":"ج.ب8 · القانون والأخلاق","en":"C.P8 · Law and ethics"},"scenario":{"ar":"جُمعت عناوين أولياء الأمور لأمسية مدرسية، ثم بِيعت إلى متجر. المثال في الوحدة مبادئ اللائحة العامة لحماية البيانات.","en":"Parents’ emails were collected for a school evening, then sold to a shop. The unit’s example is the principles of the General Data Protection Regulation."},"choices":[{"key":"purpose","ar":"حد الغرض: الجمع لغرض لا يبيح غرضاً جديداً غير متعلق.","en":"Purpose limitation: collection for one purpose does not allow an unrelated new purpose."},{"key":"acc","ar":"مبدأ الدقة هو الذي يمنع تغيير الغرض.","en":"The accuracy principle is what bans a change of purpose."},{"key":"store","ar":"لو حُذفت العناوين بعد سنة لصار البيع مباحاً.","en":"If the addresses were deleted after a year, the sale would have been allowed."}],"correct":"purpose","why":{"ar":"من مبادئ اللائحة حد الغرض: لا تُستخدم البيانات لغرض جديد غير متوافق مع سبب الجمع. الدقة تتعلق بصحة البيان، وحد التخزين بمدة الاحتفاظ.","en":"One principle is purpose limitation: data is not used for a new purpose incompatible with why it was collected. Accuracy is about correctness, and storage limitation is about how long it is kept."},"impact":{"ar":"الثقة تتزعزع، وقد تتعرض الجهة لغرامة إن انطبق هذا الإطار عليها.","en":"Trust is damaged, and the body may face a fine if this framework applies to it."},"miss":{"ar":"الدقة لا تتحدث عن البيع. وحذف البيانات ينهي الاحتفاظ ولا يحوّل البيع السابق إلى عمل مشروع.","en":"Accuracy does not speak about a sale. Deleting the data ends retention; it does not turn an earlier sale into a lawful act."}},{"id":"c18","lo":"C","code":{"ar":"ج.ب8 · القانون والأخلاق","en":"C.P8 · Law and ethics"},"scenario":{"ar":"تريد المؤسسة وثيقة تقول ما المواقع الممنوعة، وهل يُستخدم الجهاز الشخصي للعمل، وما واجب السرية.","en":"The organisation wants a document that says which sites are forbidden, whether a personal device may be used for work, and what the secrecy duty is."},"choices":[{"key":"aup","ar":"سياسة استخدام مقبول تغطي القيود والأجهزة والأمان.","en":"An acceptable use policy covering restrictions, devices and security."},{"key":"font","ar":"سياسة الاستخدام المقبول تحدد خط الرسائل فقط.","en":"An acceptable use policy only sets the font of messages."},{"key":"share","ar":"وجود السياسة يسمح للموظفين بتبادل كلمات السر.","en":"The existence of the policy allows staff to share passwords."}],"correct":"aup","why":{"ar":"سياسة الاستخدام المقبول في الوحدة تشمل قيود المواقع والوقت، وأنواع الأجهزة واستخدام الشخصي للعمل، والالتزام بالأمان.","en":"In the unit, an acceptable use policy includes limits on sites and time, device types and personal use for work, and the duty to keep security."},"impact":{"ar":"يعرف الموظف الحد قبل أن يخلط جهازه الخاص ببيانات العمل.","en":"The employee knows the limit before mixing a personal device with work data."},"miss":{"ar":"الخط شكل لا سياسة استخدام. والسياسة تقيّد المشاركة ولا تبيح تبادل كلمات السر.","en":"A font is appearance, not a use policy. The policy restricts sharing; it does not allow passwords to be exchanged."}},{"id":"c19","lo":"C","code":{"ar":"ج · السياسات","en":"C · Policy"},"scenario":{"ar":"شركة دعم خارجية ستصلح الأعطال، والمؤسسة تريد زمن استجابة واضحاً وطريقة لمتابعة الالتزام.","en":"An outside support firm will repair faults. The organisation wants a clear response time and a way to check compliance."},"choices":[{"key":"sla","ar":"اتفاقية مستوى خدمة (SLA) مع المورد تحدد الالتزام وكيف يُراقب.","en":"A service level agreement (SLA) with the supplier sets the duty and how it is monitored."},{"key":"war","ar":"ضمان الطابعة هو نفسه اتفاقية دعم مستمر مع شركة خارجية.","en":"The printer warranty is the same thing as an ongoing support agreement with an outside firm."},{"key":"aup","ar":"سياسة الاستخدام التي يوقّعها الموظف تُلزم شركة الدعم الخارجية.","en":"The acceptable use policy signed by an employee binds the outside support firm."}],"correct":"sla","why":{"ar":"اتفاقية مستوى الخدمة عقد خارجي أو داخلي يفصّل ما يقدمه المورد وكيف يُتابع الامتثال. الضمان يغطي عيباً في منتج، وسياسة الاستخدام تنظم سلوك المستخدم.","en":"A service level agreement is an external or internal contract that details what the supplier provides and how compliance is followed. A warranty covers a product fault. An acceptable use policy governs a user’s behaviour."},"impact":{"ar":"عند التأخير يوجد مرجع مكتوب بدل خلاف شفهي على «السرعة المعقولة».","en":"When there is a delay, there is a written reference instead of a spoken argument about “reasonable speed”."},"miss":{"ar":"الضمان لا يحدد زمن استجابة الدعم الشهري. وتوقيع الموظف لا يوقّع عن شركة أخرى.","en":"A warranty does not set the monthly support response time. An employee’s signature does not sign for another company."}},{"id":"c20","lo":"C","code":{"ar":"ج · السياسات","en":"C · Policy"},"scenario":{"ar":"تعطل النظام، ويريد موظف إرسال قاعدة الزبائن كاملة بالبريد حتى يساعد الجميع.","en":"The system has failed, and an employee wants to email the entire customer database so everyone can help."},"choices":[{"key":"proc","ar":"يُتبع إجراء الحادث المعتمد: تسجيل واحتواء واستعادة وإبلاغ الجهات المحددة، بلا نشر القاعدة.","en":"Follow the agreed incident procedure: record, contain, recover and tell the named parties, without publishing the database."},{"key":"mail","ar":"إرسال القاعدة إلى كل الموظفين يسرّع الإصلاح وهو جزء من الإجراء.","en":"Emailing the database to all staff speeds the repair and is part of the procedure."},{"key":"wait","ar":"يُنتظر النسخ الشهري التالي قبل تسجيل الحادث.","en":"Wait for the next monthly backup before recording the incident."}],"correct":"proc","why":{"ar":"إدارة الحادث تحتاج خطوات موحدة. الوحدة تحذّر من إرسال الحسابات أو قاعدة الزبائن بالبريد كطريقة للتعامل مع الخلل.","en":"Incident management needs the same steps every time. The unit warns against emailing the accounts or the customer database as a way of handling the fault."},"impact":{"ar":"البريد يحوّل عطلاً فنياً إلى تسريب، والتأخير في التسجيل يضيع ما حدث.","en":"The email turns a technical fault into a leak, and delay in recording loses what happened."},"miss":{"ar":"مساعدة الجميع لا تبرر نشر البيانات. وانتظار شهر يترك الحادث بلا أثر وبلا استعادة مرتبة.","en":"Helping everyone does not justify publishing the data. Waiting a month leaves the incident with no trace and no ordered recovery."}}];

      ["Outcome B", "How the organisation uses data and information, inside and outside."],
      ["Outcome C", "Policies for use: threats, protection, law and ethics."]
    ],
    name: "Student name",
    ph: "Type your name",
    start: "Start the exam",
    note: "60 short questions, three close choices each. Question order and choice order are shuffled on every attempt. A wrong answer shows a gap in the service. A right answer shows the service is ready. Opening the report sends the mark and every question to the teacher log.",
    case: "Situation",
    confirm: "Confirm answer",
    next: "Next question",
    finish: "Show the infrastructure report",
    why: "Why this answer",
    impact: "Effect on the organisation",
    miss: "Why the other two fail",
    secure: "Service ready",
    verified: "The choice fits the need",
    breach: "Link incomplete",
    denied: "This choice does not serve the case",
    correctStamp: "Fitting choice",
    wrongStamp: "A close choice, but it does not match the case",
    reportKicker: "Infrastructure understanding report",
    scoreLine: (n, t) => `${n} of ${t}`,
    weakest: "Weakest outcome in this attempt",
    review: "Review questions",
    again: "Retake the exam",
    missed: "Questions to reread",
    noneMiss: "There were no wrong answers in this attempt.",
    disclaimer: "This is formative practice for Unit 1, not an official awarding-body grade.",
    bands: [
      [90, "Infrastructure designer", "Distinction-level: you separate device, software and network, read data before a decision, and tie policy to the threat."],
      [75, "Systems analyst", "Strong merit-level work. Revisit the weakest outcome before a distinction task."],
      [60, "Qualified user", "You cleared applied understanding. Look harder at the close choices."],
      [40, "Incomplete setup", "Some functions still mix: input with output, storage with joint editing, or protection with law."],
      [0, "Rebuild the ideas", "Reread the unit through the question: what is needed, which part meets it, and what the wrong choice would break."]
    ],
    lo: { A: "Outcome A", B: "Outcome B", C: "Outcome C" },
    reviewNext: "Next in review",
    backReport: "Back to the report",
    sheetSending: "Sending the mark and every question to the teacher log…",
    sheetSent: "The mark and every question were sent to the teacher log.",
    sheetFail: "The mark did not arrive. Check the connection, then open the report again.",
    sheetLocal: "The mark stays on this device. The teacher log needs the results script published once."
  }
};

const state = {
  lang: "ar",
  screen: "intro",
  name: "",
  index: 0,
  picked: null,
  locked: false,
  answers: [],
  paper: [],
  shuffle: [],
  mute: false,
  sent: false,
  sending: false,
  sheetNote: ""
};

let audioCtx = null;
let fxTimer = 0;

function t() { return UI[state.lang]; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function letters() {
  return state.lang === "ar" ? ["أ", "ب", "ج"] : ["A", "B", "C"];
}

function correctCount() {
  return state.answers.reduce((n, key, i) => n + (key === QUESTIONS[i].correct ? 1 : 0), 0);
}

function tone(ok) {
  if (state.mute) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const play = (freq, t0, dur, peak) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(freq, t0);
      o.connect(g);
      g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    };
    if (ok) {
      play(523.25, now, 0.16, 0.05);
      play(659.25, now + 0.1, 0.16, 0.045);
      play(783.99, now + 0.2, 0.24, 0.04);
    } else {
      play(349.23, now, 0.14, 0.035);
      play(293.66, now + 0.13, 0.22, 0.03);
    }
  } catch (err) { /* audio is optional */ }
}

function showFx(ok) {
  const fx = document.getElementById("fx");
  const u = t();
  const lines = ok ? "LINK UP\nTASK OK\nSERVICE LIVE" : "LINK WEAK\nCHOICE MISS\nREVIEW NEED";
  fx.className = "fx on " + (ok ? "good" : "bad");
  fx.innerHTML = `<div class="fx-card"><p class="kicker">${ok ? "READY" : "GAP"}</p><h2>${esc(ok ? u.secure : u.breach)}</h2><p class="stamp">${esc(ok ? u.verified : u.denied)}</p><div class="stream">${lines}</div></div>`;
  document.body.classList.toggle("gap", !ok);
  clearTimeout(fxTimer);
  const motion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  fxTimer = setTimeout(() => {
    fx.className = "fx";
    fx.innerHTML = "";
    document.body.classList.remove("gap");
  }, motion ? 600 : (ok ? 1100 : 1300));
}

function choiceByKey(q, key) {
  return q.choices.find((c) => c.key === key);
}

function render() {
  const u = t();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.title = state.lang === "ar"
    ? "اختبار الوحدة 1 | أنظمة تكنولوجيا المعلومات"
    : "Unit 1 exam | IT systems";
  document.getElementById("brandSub").textContent = u.sub;
  document.getElementById("langBtn").textContent = u.lang;
  document.getElementById("muteBtn").textContent = state.mute ? u.unmute : u.mute;
  const shown = state.screen === "intro" ? 0 : correctCount();
  document.getElementById("liveScore").textContent = u.live(shown, QUESTIONS.length);
  const app = document.getElementById("app");
  if (state.screen === "intro") app.innerHTML = introHtml();
  else if (state.screen === "report") app.innerHTML = reportHtml();
  else app.innerHTML = examHtml();
  if (state.screen === "report" && state.sheetNote) {
    const box = document.getElementById("sheetStatus");
    if (box) box.textContent = state.sheetNote;
  }
}

function introHtml() {
  const u = t();
  const cards = u.outcomes.map(([h, p]) => `<article class="card"><b>${esc(h)}</b><span>${esc(p)}</span></article>`).join("");
  return `<section class="panel">
    <p class="kicker">${esc(u.kicker)}</p>
    <h1>${esc(u.title)}</h1>
    <p class="lede">${esc(u.lede)}</p>
    <div class="grid">${cards}</div>
    <label class="field">${esc(u.name)}
      <input id="nameInput" type="text" maxlength="60" placeholder="${esc(u.ph)}" value="${esc(state.name)}" autocomplete="name">
    </label>
    <div class="row">
      <button type="button" class="primary" data-action="start">${esc(u.start)}</button>
    </div>
    <p class="hint">${esc(u.note)}</p>
  </section>`;
}

function qIndex() {
  return state.paper[state.index];
}

function examHtml() {
  const u = t();
  const qi = qIndex();
  const q = QUESTIONS[qi];
  const review = state.screen === "review";
  const order = state.shuffle[qi];
  const pct = Math.round((state.index / QUESTIONS.length) * 100);
  const opts = order.map((key, i) => {
    const c = choiceByKey(q, key);
    let cls = "choice";
    if (state.picked === key) cls += " selected";
    if (state.locked && key === q.correct) cls += " good";
    if (state.locked && state.picked === key && key !== q.correct) cls += " bad";
    return `<button type="button" class="${cls}" data-action="pick" data-key="${esc(key)}" ${state.locked ? "disabled" : ""}>
      <span class="letter">${letters()[i]}</span><span>${esc(c[state.lang])}</span>
    </button>`;
  }).join("");
  let feedback = "";
  if (state.locked) {
    const ok = state.picked === q.correct;
    feedback = `<div class="feedback ${ok ? "good" : "bad"}">
      <p class="stamp">${esc(ok ? u.correctStamp : u.wrongStamp)}</p>
      <h3>${esc(u.why)}</h3><p>${esc(q.why[state.lang])}</p>
      <h3>${esc(u.impact)}</h3><p>${esc(q.impact[state.lang])}</p>
      <h3>${esc(u.miss)}</h3><p>${esc(q.miss[state.lang])}</p>
    </div>`;
  }
  const last = state.index === QUESTIONS.length - 1;
  let action = "";
  if (!state.locked) {
    action = `<button type="button" class="primary" data-action="confirm" ${state.picked ? "" : "disabled"}>${esc(u.confirm)}</button>`;
  } else if (review && last) {
    action = `<button type="button" class="primary" data-action="report">${esc(u.backReport)}</button>`;
  } else if (last) {
    action = `<button type="button" class="primary" data-action="report">${esc(u.finish)}</button>`;
  } else {
    action = `<button type="button" class="primary" data-action="next">${esc(review ? u.reviewNext : u.next)}</button>`;
  }
  return `<section class="panel">
    <div class="meta">
      <span class="chip">${esc(q.code[state.lang])}</span>
      <span>${esc(u.case)} <span class="count">${String(state.index + 1).padStart(2, "0")} / ${QUESTIONS.length}</span></span>
    </div>
    <div class="bar" aria-hidden="true"><span style="width:${pct}%"></span></div>
    <div class="scenario"><strong>${esc(u.lo[q.lo])}</strong><p>${esc(q.scenario[state.lang])}</p></div>
    <div class="choices">${opts}</div>
    ${feedback}
    <div class="row" style="margin-top:16px">${action}</div>
  </section>`;
}

function bandFor(pct) {
  return t().bands.find((b) => pct >= b[0]);
}

function groupsNow() {
  const groups = { A: [0, 0], B: [0, 0], C: [0, 0] };
  QUESTIONS.forEach((q, i) => {
    groups[q.lo][1] += 1;
    if (state.answers[i] === q.correct) groups[q.lo][0] += 1;
  });
  return groups;
}

function reportHtml() {
  const u = t();
  const total = QUESTIONS.length;
  const score = correctCount();
  const pct = Math.round((score / total) * 100);
  const band = bandFor(pct);
  const groups = groupsNow();
  let weak = "A";
  let weakRatio = 2;
  Object.keys(groups).forEach((k) => {
    const ratio = groups[k][1] ? groups[k][0] / groups[k][1] : 1;
    if (ratio < weakRatio) { weakRatio = ratio; weak = k; }
  });
  const rows = Object.keys(groups).map((k) => {
    const [ok, n] = groups[k];
    const w = n ? Math.round((ok / n) * 100) : 0;
    return `<div class="lo-row"><span>${esc(u.lo[k])}</span><div class="lo-track"><span style="width:${w}%"></span></div><b class="count">${ok}/${n}</b></div>`;
  }).join("");
  const misses = state.paper.map((i) => ({ q: QUESTIONS[i], i })).filter(({ q, i }) => state.answers[i] !== q.correct);
  const missHtml = misses.length
    ? misses.map(({ q }) => `<article><b>${esc(q.code[state.lang])}</b><p>${esc(q.scenario[state.lang])}</p><p>${esc(q.why[state.lang])}</p></article>`).join("")
    : `<p>${esc(u.noneMiss)}</p>`;
  const who = state.name.trim() || (state.lang === "ar" ? "الطالب" : "Student");
  return `<section class="panel">
    <p class="kicker">${esc(u.reportKicker)}</p>
    <div class="report-top">
      <div class="ring" style="--p:${pct}"><span>${pct}%</span></div>
      <div>
        <h1>${esc(band[1])}</h1>
        <p class="lede">${esc(who)} · ${esc(u.scoreLine(score, total))}</p>
        <p>${esc(band[2])}</p>
        <p><strong>${esc(u.weakest)}:</strong> ${esc(u.lo[weak])}</p>
      </div>
    </div>
    ${rows}
    <div class="miss"><h2>${esc(u.missed)}</h2>${missHtml}</div>
    <div class="row" style="margin-top:16px">
      <button type="button" class="primary" data-action="review">${esc(u.review)}</button>
      <button type="button" class="ghost" data-action="restart">${esc(u.again)}</button>
    </div>
    <p class="hint" id="sheetStatus"></p>
    <p class="hint">${esc(u.disclaimer)}</p>
  </section>`;
}

function startExam() {
  const input = document.getElementById("nameInput");
  state.name = input ? input.value : state.name;
  state.answers = QUESTIONS.map(() => null);
  state.paper = shuffle(QUESTIONS.map((_, i) => i));
  state.shuffle = QUESTIONS.map((q) => shuffle(q.choices.map((c) => c.key)));
  state.index = 0;
  state.picked = null;
  state.locked = false;
  state.screen = "exam";
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (err) { /* ignore */ }
  render();
}

function onAppClick(event) {
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "start") startExam();
  if (action === "pick" && !state.locked) {
    state.picked = el.dataset.key;
    render();
  }
  if (action === "confirm" && state.picked && !state.locked) {
    state.locked = true;
    state.answers[qIndex()] = state.picked;
    const ok = state.picked === QUESTIONS[qIndex()].correct;
    tone(ok);
    showFx(ok);
    render();
  }
  if (action === "next") {
    state.index += 1;
    state.picked = state.screen === "review" ? state.answers[qIndex()] : null;
    state.locked = state.screen === "review";
    render();
  }
  if (action === "report") {
    state.screen = "report";
    render();
    submitResult();
  }
  if (action === "review") {
    state.screen = "review";
    state.index = 0;
    state.picked = state.answers[state.paper[0]];
    state.locked = true;
    render();
  }
  if (action === "restart") {
    state.screen = "intro";
    state.index = 0;
    state.picked = null;
    state.locked = false;
    state.sent = false;
    state.sending = false;
    state.sheetNote = "";
    state.answers = [];
    state.paper = [];
    render();
  }
}

function boot() {
  if (QUESTIONS.length !== 60) throw new Error("Expected 60 questions");
  const seen = new Set();
  QUESTIONS.forEach((q) => {
    if (seen.has(q.id)) throw new Error("Duplicate " + q.id);
    seen.add(q.id);
    if (!["A", "B", "C"].includes(q.lo)) throw new Error("Bad lo " + q.id);
    if (q.choices.length !== 3 || !q.choices.some((c) => c.key === q.correct)) {
      throw new Error("Bad choices " + q.id);
    }
    ["scenario", "why", "impact", "miss"].forEach((f) => {
      if (!q[f] || !q[f].ar || !q[f].en) throw new Error("Missing " + f + " " + q.id);
    });
  });
  document.getElementById("app").addEventListener("click", onAppClick);
  document.getElementById("app").addEventListener("input", (event) => {
    if (event.target.id === "nameInput") state.name = event.target.value;
  });
  document.getElementById("langBtn").addEventListener("click", () => {
    state.lang = state.lang === "ar" ? "en" : "ar";
    render();
  });
  document.getElementById("muteBtn").addEventListener("click", () => {
    state.mute = !state.mute;
    render();
  });
  document.addEventListener("keydown", (event) => {
    if (state.screen !== "exam" || state.locked) return;
    const map = { "1": 0, "2": 1, "3": 2, a: 0, b: 1, c: 2 };
    const idx = map[event.key.toLowerCase()];
    if (idx === undefined) return;
    state.picked = state.shuffle[qIndex()][idx];
    render();
  });
  render();
}

const SHEET_URL = "https://script.google.com/macros/s/AKfycbzH-C3NxDYTreIsLtQZVoqqnsCJgyyyAAJRpxxTvBNP6KB8wYbkCMI6cglKZNaXRi8/exec";

function submitResult() {
  const note = function (text) {
    state.sheetNote = text;
    const live = document.getElementById("sheetStatus");
    if (live) live.textContent = text;
  };
  if (state.sent) {
    note(state.sheetNote || "");
    return;
  }
  const u = t();
  if (!SHEET_URL) {
    note(u.sheetLocal);
    return;
  }
  const total = QUESTIONS.length;
  const score = correctCount();
  const pct = Math.round((score / total) * 100);
  const band = bandFor(pct);
  const groups = groupsNow();
  note(u.sheetSending);
  state.sending = true;
  fetch(SHEET_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      name: state.name.trim(),
      correct: score,
      total: total,
      percent: pct,
      band: band[1],
      outcomeA: groups.A[0] + "/" + groups.A[1],
      outcomeB: groups.B[0] + "/" + groups.B[1],
      outcomeC: groups.C[0] + "/" + groups.C[1],
      items: QUESTIONS.map((q, i) => {
        const chosen = q.choices.find((c) => c.key === state.answers[i]);
        return {
          n: i + 1,
          code: q.code.ar,
          lo: q.lo,
          ok: state.answers[i] === q.correct ? 1 : 0,
          pick: chosen ? chosen.ar : ""
        };
      })
    })
  }).then(() => {
    state.sent = true;
    state.sending = false;
    note(t().sheetSent);
  }).catch(() => {
    state.sending = false;
    note(t().sheetFail);
  });
}

boot();
</script>
</body>
</html>
